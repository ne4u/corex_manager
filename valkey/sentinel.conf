# Valkey Sentinel configuration for coreX Manager HA
#
# Sentinel monitors the "mymaster" Valkey primary and fails over to the
# valkey-replica if the primary becomes unavailable. With only one Sentinel
# instance (single-host Compose), quorum is 1 — sufficient for a 2-node
# Valkey setup but not for production multi-host. For production, run 3
# Sentinel instances on separate hosts.
#
# This file is mounted read-only into the valkey-sentinel container. Sentinel
# rewrites its own config at runtime to /data/sentinel.conf (the /data volume),
# so this file only provides the initial configuration.

port 26379

# Master definition: name, IP, port, quorum
sentinel monitor mymaster valkey 6379 1

# Down after milliseconds (5 seconds)
sentinel down-after-milliseconds mymaster 5000

# Failover timeout (30 seconds)
sentinel failover-timeout mymaster 30000

# Parallel syncs — number of replicas to reconfigure simultaneously
sentinel parallel-syncs mymaster 1

# If VALKEY_PASSWORD is set, uncomment and set these:
# sentinel auth-pass mymaster yourpassword
