{{- if .Values.cap.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cap
  namespace: {{ include "corex-manager.namespace" . }}
  labels:
    {{- include "corex-manager.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: corex-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corex-manager
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cap
    spec:
      containers:
        - name: cap
          image: {{ .Values.cap.image }}
          env:
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Release.Name) }}
                  key: CAP_ADMIN_KEY
          ports:
            - name: cap
              containerPort: 3000
              protocol: TCP
          resources:
            {{- toYaml .Values.cap.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cap
  namespace: {{ include "corex-manager.namespace" . }}
  labels:
    {{- include "corex-manager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: corex-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cap
  ports:
    - name: cap
      port: 3000
      targetPort: cap
      protocol: TCP
{{- end }}
