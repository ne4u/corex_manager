{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ include "corex-manager.namespace" . }}
  labels:
    {{- include "corex-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.secretKey is required (generate with: python -c \"import secrets; print(secrets.token_urlsafe(32))\")" .Values.secrets.secretKey | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
  DATAPLANE_API_USER: {{ .Values.secrets.dataplaneApiUser | quote }}
  DATAPLANE_API_PASSWORD: {{ .Values.secrets.dataplaneApiPassword | quote }}
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: {{ include "corex-manager.databaseUrl" . | quote }}
  {{- else if .Values.postgres.external.existingSecret }}
  # External DB password comes from the existing secret
  {{- else }}
  DATABASE_URL: {{ include "corex-manager.databaseUrl" . | quote }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  VALKEY_URL: {{ include "corex-manager.valkeyUrl" . | quote }}
  {{- else if not .Values.valkey.external.existingSecret }}
  VALKEY_URL: {{ include "corex-manager.valkeyUrl" . | quote }}
  {{- end }}
  {{- if .Values.cap.enabled }}
  CAP_ADMIN_KEY: {{ .Values.cap.adminKey | quote }}
  {{- end }}
  {{- if .Values.mcpGateway.enabled }}
  MCP_SECRETS_KEY: {{ required "mcpGateway.secretsKey is required when mcpGateway.enabled" .Values.mcpGateway.secretsKey | quote }}
  {{- end }}
  {{- if .Values.mcpServer.enabled }}
  COREX_MCP_TOKEN: {{ .Values.mcpServer.corexMcpToken | quote }}
  MCP_SERVICE_TOKEN: {{ .Values.mcpServer.mcpServiceToken | quote }}
  {{- end }}
{{- end }}
