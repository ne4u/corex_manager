# Bootstrap config for HAProxy. Global, defaults, frontends and backends are
# generated by the control plane and written to /app/data/haproxy.cfg.

# Credentials are injected at runtime from DATAPLANEAPI_USER / DATAPLANEAPI_PASS
# environment variables by entrypoint.sh. Do not hardcode passwords here.
userlist dataplane-api
    # user <DATAPLANEAPI_USER> insecure-password <DATAPLANEAPI_PASS>

program api
    command /usr/local/bin/dataplaneapi --host=0.0.0.0 --port=5555 --scheme=https --tls-cert-file=/etc/haproxy/tls/dataplane.crt --tls-key-file=/etc/haproxy/tls/dataplane.key --config-file=/app/data/haproxy.cfg --haproxy-bin=/usr/local/sbin/haproxy --reload-cmd="kill -SIGUSR2 1" --reload-delay=5 --userlist=dataplane-api --reload-retention=5 --show-system-info --log-level=info
    no option start-on-reload

frontend stats
    bind *:8404
    stats uri /
    stats refresh 10s
