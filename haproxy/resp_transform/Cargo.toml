[package]
name = "haproxy-resp-transform"
version = "0.1.0"
edition = "2021"
autotests = false
readme = "README.md"
keywords = ["haproxy", "response", "transform", "mask", "rewrite"]
license = "MIT"
description = "HAProxy filter for response body rewrite, injection, and bidirectional mask/unmask"

[workspace]
members = [
    "module",
]

[dependencies]
mlua = { version = "0.11", features = ["macros"] }
haproxy-api = { version = "0.9" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
base64 = "0.22"
once_cell = "1"
parking_lot = "0.12"
rand = "0.8"
redis = { version = "0.26", default-features = false }
dashmap = "6"
form_urlencoded = "1"
