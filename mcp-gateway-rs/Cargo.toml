[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/scan",
    "crates/policy",
    "crates/proxy",
    "crates/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Errors
thiserror = "2"
anyhow = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Utilities
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
url = "2"
# Regex
regex = "1"
# Crypto (bundle envelope)
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
# Auth
bcrypt = "0.16"
jsonwebtoken = "9"
# Valkey (Redis-compatible) client
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
# HTTP client (JWKS fetch)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Async utilities
futures = "0.3"
# Internal crates
corex-core = { path = "crates/core" }
corex-scan = { path = "crates/scan" }
corex-policy = { path = "crates/policy" }
corex-proxy = { path = "crates/proxy" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
