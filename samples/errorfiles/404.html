<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(129, 140, 248, 0.12) 0%, transparent 50%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      text-align: center;
      overflow: hidden;
    }

    .background-shapes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.25;
      animation: float 18s ease-in-out infinite;
    }

    .shape-1 {
      width: 400px;
      height: 400px;
      background: var(--accent);
      top: -120px;
      left: -120px;
      animation-delay: -4s;
    }

    .shape-2 {
      width: 320px;
      height: 320px;
      background: var(--accent-2);
      bottom: -80px;
      right: -80px;
      animation-delay: -8s;
    }

    .shape-3 {
      width: 240px;
      height: 240px;
      background: #f472b6;
      top: 50%;
      left: 60%;
      animation-delay: -12s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.05); }
      66% { transform: translate(-20px, 30px) scale(0.95); }
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: calc(100% - 48px);
      padding: 56px 44px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 28px;
      color: var(--accent);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    .code {
      font-size: clamp(72px, 18vw, 140px);
      font-weight: 800;
      line-height: 1;
      margin: 0 0 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 12px;
    }

    .message {
      font-size: 17px;
      line-height: 1.6;
      color: var(--text-muted);
      margin: 0 0 28px;
    }

    .details {
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 28px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .detail-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text);
      word-break: break-all;
      text-align: right;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0f172a;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(56, 189, 248, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--surface-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }

    .footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      z-index: 1;
      font-size: 13px;
      color: var(--text-muted);
      opacity: 0.7;
    }

    @media (max-width: 560px) {
      .card {
        padding: 40px 24px;
      }

      .detail-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .detail-value {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="background-shapes" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <main class="card" role="main" aria-labelledby="error-code">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <circle cx="11" cy="11" r="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 16l5 5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 9l4 4M13 9l-4 4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <h1 class="code" id="error-code">404</h1>
    <h2 class="title" id="error-title">Page not found</h2>
    <p class="message" id="error-message">
      The page you’re looking for doesn’t exist or has been moved.
    </p>

    <div class="details" aria-label="Error details">
      <div class="detail-row">
        <span class="detail-label">Reference ID</span>
        <span class="detail-value" id="error-ref">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Time</span>
        <span class="detail-value" id="error-time">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Path</span>
        <span class="detail-value" id="error-path">—</span>
      </div>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-primary">Go home</a>
      <a href="javascript:history.back()" class="btn btn-secondary">Go back</a>
    </div>
  </main>

  <footer class="footer" aria-hidden="true">
    Not found logged. Reference: <span id="footer-ref">—</span>
  </footer>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);

      function setText(id, value, fallback) {
        const el = document.getElementById(id);
        if (el) el.textContent = value || fallback;
      }

      const ref = params.get('ref') || 'NF-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substring(2, 6).toUpperCase();
      const path = params.get('path') || params.get('url') || window.location.pathname;
      const title = params.get('title');
      const message = params.get('message');

      setText('error-ref', ref);
      setText('error-time', new Date().toISOString());
      setText('error-path', path);
      setText('footer-ref', ref);
      if (title) setText('error-title', title);
      if (message) setText('error-message', message);
    })();
  </script>
</body>
</html>
