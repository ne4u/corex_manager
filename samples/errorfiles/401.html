<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>401 Unauthorized</title>
  <style>
    :root {
      --bg-1: #0b1220;
      --bg-2: #1e1b4b;
      --accent: #0ea5e9;
      --accent-2: #a855f7;
      --text: #f0f9ff;
      --text-muted: #93c5fd;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(14, 165, 233, 0.14) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      text-align: center;
      overflow: hidden;
    }

    .background-shapes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.22;
      animation: float 20s ease-in-out infinite;
    }

    .shape-1 {
      width: 420px;
      height: 420px;
      background: var(--accent);
      top: -140px;
      left: -100px;
      animation-delay: -4s;
    }

    .shape-2 {
      width: 340px;
      height: 340px;
      background: var(--accent-2);
      bottom: -100px;
      right: -80px;
      animation-delay: -11s;
    }

    .shape-3 {
      width: 260px;
      height: 260px;
      background: #60a5fa;
      top: 45%;
      left: 55%;
      animation-delay: -17s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(25px, -35px) scale(1.04); }
      66% { transform: translate(-25px, 25px) scale(0.96); }
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: calc(100% - 48px);
      padding: 56px 44px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      backdrop-filter: blur(18px);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 28px;
      color: var(--accent);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.05); }
    }

    .code {
      display: inline-block;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      background: rgba(14, 165, 233, 0.12);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      border: 1px solid rgba(14, 165, 233, 0.22);
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }

    .message {
      font-size: 17px;
      line-height: 1.7;
      color: var(--text-muted);
      margin: 0 0 28px;
    }

    .details {
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 28px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .detail-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text);
      word-break: break-all;
      text-align: right;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b1220;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(14, 165, 233, 0.36);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--surface-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }

    .footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      z-index: 1;
      font-size: 13px;
      color: var(--text-muted);
      opacity: 0.7;
    }

    @media (max-width: 560px) {
      .card {
        padding: 40px 24px;
      }

      .detail-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .detail-value {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="background-shapes" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <main class="card" role="main" aria-labelledby="error-title">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="5" y="11" width="14" height="10" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 11V7a4 4 0 018 0v4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 16v-2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="16.5" r="1" fill="currentColor" stroke="none"/>
    </svg>

    <div class="code" id="error-code">401</div>
    <h1 class="title" id="error-title">Unauthorized</h1>
    <p class="message" id="error-message">
      You need to sign in or provide valid credentials to access this resource.
    </p>

    <div class="details" aria-label="Error details">
      <div class="detail-row">
        <span class="detail-label">Reference ID</span>
        <span class="detail-value" id="error-ref">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Time</span>
        <span class="detail-value" id="error-time">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Reason</span>
        <span class="detail-value" id="error-reason">—</span>
      </div>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-secondary">Go home</a>
      <a href="/login" class="btn btn-primary" id="login-link">Log in</a>
    </div>
  </main>

  <footer class="footer" aria-hidden="true">
    Authentication required. Reference: <span id="footer-ref">—</span>
  </footer>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);

      function setText(id, value, fallback) {
        const el = document.getElementById(id);
        if (el) el.textContent = value || fallback;
      }

      const ref = params.get('ref') || 'AUTH-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substring(2, 6).toUpperCase();
      const reason = params.get('reason') || '—';
      const redirect = params.get('redirect') || '/';
      const title = params.get('title');
      const message = params.get('message');

      setText('error-ref', ref);
      setText('error-time', new Date().toISOString());
      setText('error-reason', reason);
      setText('footer-ref', ref);
      if (title) setText('error-title', title);
      if (message) setText('error-message', message);

      const loginLink = document.getElementById('login-link');
      if (loginLink && redirect) {
        const href = '/login';
        const sep = href.indexOf('?') === -1 ? '?' : '&';
        loginLink.href = href + sep + 'redirect=' + encodeURIComponent(redirect);
      }
    })();
  </script>
</body>
</html>
